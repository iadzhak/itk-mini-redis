[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Iadzhak Sergei", email = "yadzhak@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.1",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
dev = "app.main:serve"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-grpc>=0.8.0",
]

[tool.pytest]
addopts = ["-vv"]
